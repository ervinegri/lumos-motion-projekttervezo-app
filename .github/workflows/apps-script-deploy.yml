# A háttérkód (apps-script/src/*.gs) automatikus frissítése és telepítése (új verzió ugyanazon a webapp-URL-en)
# Beállítás: Settings → Secrets and variables → Actions
#   CLASPRC_JSON      – a `clasp login` után létrejött ~/.clasprc.json teljes tartalma (titok)
#   CLASP_SCRIPT_ID   – az Apps Script projekt azonosítója (Projektbeállítások → Azonosítók → Szkriptazonosító)
# A webapp telepítésének azonosítója a config.js-ben lévő /macros/s/…/exec URL-ből jön.
name: Apps Script telepítés
on:
  push:
    branches: [main]
    paths: ['apps-script/src/**', 'apps-script/Templates.gs']
  workflow_dispatch:
concurrency: { group: apps-script-deploy, cancel-in-progress: true }   # gyors egymásutáni módosításoknál csak az utolsó települ (kevesebb verzió)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Várakozás (összevonjuk a gyors egymásutáni módosításokat)
        if: github.event_name == 'push'
        run: sleep 60
      - uses: actions/checkout@v4
      - name: Beállítások ellenőrzése
        id: chk
        env: { RC: '${{ secrets.CLASPRC_JSON }}', SID: '${{ secrets.CLASP_SCRIPT_ID }}' }
        run: |
          if [ -z "$RC" ] || [ -z "$SID" ]; then echo "::warning::CLASPRC_JSON / CLASP_SCRIPT_ID nincs beállítva – kihagyva"; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with: { node-version: 20 }
      - name: Feltöltés és telepítés
        if: steps.chk.outputs.skip != '1'
        env: { RC: '${{ secrets.CLASPRC_JSON }}', SID: '${{ secrets.CLASP_SCRIPT_ID }}' }
        run: |
          set -euo pipefail
          npm i -g @google/clasp@2.4.2 >/dev/null
          printf '%s' "$RC" > ~/.clasprc.json
          DEP=$(grep -o 'macros/s/[A-Za-z0-9_-]*/exec' config.js | sed 's#macros/s/##; s#/exec##')
          mkdir -p /tmp/gas && cd /tmp/gas
          printf '{"scriptId":"%s","rootDir":"."}' "$SID" > .clasp.json
          clasp pull                         # az élő manifest (appsscript.json) megmarad
          node -e "const m=require('./appsscript.json');console.log('Manifest oauthScopes:',JSON.stringify(m.oauthScopes||'(automatikus)'))" || true
          rm -f Code.js Code.gs Templates.js Templates.gs ./[0-9][0-9]_*.js   # a régi egyfájlos kód (Code.js) helyére a modulok kerülnek; más fájlhoz nem nyúlunk
          ORDER='"appsscript.json"'
          for f in "$GITHUB_WORKSPACE"/apps-script/src/*.gs; do n=$(basename "$f" .gs); cp "$f" "$n.js"; ORDER="$ORDER,\"$n.js\""; done   # betöltési sorrend: a fájlnév eleji szám
          printf '{"scriptId":"%s","rootDir":".","filePushOrder":[%s,"Templates.js"]}' "$SID" "$ORDER" > .clasp.json
          ls -1 *.js
          cp "$GITHUB_WORKSPACE/apps-script/Templates.gs" Templates.js   # szerződéssablonok
          clasp push -f
          N=$(clasp versions 2>/dev/null | grep -cE '^[0-9]+ - ' || true)
          echo "Verziók száma: $N / 200"
          if [ "${N:-0}" -ge 199 ]; then echo "::error::Az Apps Script elérte a 200 verziós korlátot – Projekt előzmények → Verziók tömeges törlése"; exit 1; fi
          clasp deploy -i "$DEP" -d "auto $(echo $GITHUB_SHA | cut -c1-7)"
          [ "${N:-0}" -ge 170 ] && echo "::warning::Apps Script verziók: $((N+1))/200 – hamarosan takarítani kell" || true
