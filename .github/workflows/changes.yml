# Változásnapló az app „Az app frissült” értesítéséhez: minden push után a legutóbbi commitok címéből changes.json készül
name: Változásnapló
on:
  push:
    branches: [main]
    paths-ignore: ['changes.json']
permissions:
  contents: write
concurrency: { group: changes-json, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 60 }
      - name: changes.json frissítése
        continue-on-error: true
        run: |
          set -uo pipefail
          git log -40 --no-merges --format='%H%x09%cI%x09%s' -- . ':!changes.json' | python3 -c '
          import sys,json
          out=[]
          for l in sys.stdin:
              h,d,s=l.rstrip("\n").split("\t",2)
              if s.startswith("Teszt") or s.startswith("Merge"): continue
              out.append({"id":h[:10],"at":d,"msg":s})
          json.dump({"items":out},open("changes.json","w"),ensure_ascii=False,indent=0)'
          if git diff --quiet -- changes.json; then echo "nincs változás"; exit 0; fi
          git config user.name "github-actions[bot]"; git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add changes.json && git commit -qm "Változásnapló frissítése"
          # a GitHub néha átmeneti hibát ad (500), vagy közben új commit érkezett: többször újrapróbálja, és soha nem bukik el
          # (a következő push úgyis újragenerálja a változásnaplót), így nem jön hibaértesítő e-mail
          for i in 1 2 3 4 5; do
            if git push -q; then echo "kész"; exit 0; fi
            sleep $((i*5)); git pull -q --rebase -X theirs || { git rebase --abort || true; git reset -q --hard origin/main; exit 0; }
          done
          echo "::warning::A változásnapló most nem frissült (GitHub hiba) – a következő feltöltésnél pótlódik."
