<!doctype html>
<html lang="hu">
<head>
<base href="/">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Árajánlat – Lumos Motion</title>
<link rel="icon" href="favicon-32.png">
<style>
@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02AF}
:root{--ink:#101923;--mut:#56656f;--line:#dde4eb;--bg:#f0f4f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;padding:28px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(16,25,35,.08);width:min(640px,100%);margin:0 auto;padding:26px}
.logo{height:46px;width:auto;display:block;margin-bottom:18px}
h1{font-size:20px;margin:0 0 4px;line-height:1.3}
.sub{color:var(--mut);margin:0 0 18px;font-size:14px}
table{width:100%;border-collapse:collapse;margin:6px 0 18px;font-size:15px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);padding:8px 6px;border-bottom:2px solid var(--ink)}
td{padding:10px 6px;border-bottom:1px solid var(--line)}
.r{text-align:right;white-space:nowrap}
tr.tot td{border-bottom:0;font-weight:700;font-size:16px}
.req{background:#f3f6f9;border-left:3px solid #9aa7b4;border-radius:8px;padding:10px 12px;margin:0 0 16px;font-size:14px;line-height:1.5}.req b{display:block;margin-bottom:4px}
.hint{font-size:13px;color:var(--mut);margin:0 0 14px;line-height:1.5}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px;resize:vertical;margin:0 0 14px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:13px 18px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);flex:1;min-width:180px}
button.ok{background:#4f9a68;border-color:#4f9a68;color:#fff}
button:disabled{opacity:.6;cursor:default}
.msg{padding:16px;border-radius:12px;background:#f3f6f9;font-weight:600;line-height:1.5;text-align:center}
.msg.ok{background:#eaf7ef;color:#1e7a46}
.err{color:#b3261e;font-size:14px;margin:10px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="logo-jovahagyas.png" alt="Lumos Motion">
  <div id="box"><p class="hint">Betöltés…</p></div>
</div>
<script src="config.js"></script>
<script src="ajanlat.js"></script>
</body>
</html>
