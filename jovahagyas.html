@media (min-width:861px){#main.vside .varr-host{position:relative}#main.vside .varr{display:flex;position:absolute;top:50%;margin-top:-26px;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#1d2a38;align-items:center;justify-content:center;padding:0;cursor:pointer;box-shadow:0 4px 14px rgba(16,25,35,.08);z-index:6}
  #main.vside .varr.prev{left:-72px}#main.vside .varr.next{right:-72px}#main.vside .varr:hover:not(:disabled){background:#f3f6f9}#main.vside .varr:disabled{opacity:.25;cursor:default}
  #main.vside:has(.varr) .side{margin-left:84px!important;width:calc(100% - 84px)!important;min-width:0}}   /* a videó két oldalán nyilak (a panel arrébb kerül, hogy ne takarja) */
.vdl-w{background:none!important;border:0!important;padding:0!important}.vdl-list{display:flex;flex-direction:column;gap:4px;margin-top:8px;text-align:left}.vdl-i{font-size:13px;font-weight:600;color:#1d2a38;text-decoration:none;padding:6px 10px;border-radius:8px;background:#f3f6f9}.vdl-i:hover{background:#e8eef3}.vdl-i.off{color:#8a96a3;font-weight:400}
.vn-dots{flex-wrap:nowrap;gap:6px}.vn-d{flex:0 1 26px;min-width:20px}.vn-dots.many{flex-wrap:wrap}   /* a számok egy sorban maradnak (sok videónál törhet) */

<body>
<div id="intro" aria-hidden="true"><img src="logo-jovahagyas.png" width="1316" height="373" alt=""><div class="ibar"><i></i></div></div>
<main class="card">
  <div class="head"><img class="logo" src="logo-jovahagyas.png" width="1316" height="373" alt="Lumos Motion Jóváhagyás">
    <div class="ttl" id="ttl" hidden><h1 id="video"></h1><p class="sub"><span id="project"></span><span id="newTab" hidden> · <a id="watch2" href="#" target="_blank" rel="noopener">↗ Megnyitás új lapon</a></span></p></div></div>
  <p id="load">Betöltés…</p>
  <section id="main" class="body" hidden>
    <div><div class="player" id="player"></div></div>
    <aside class="side">
      <div id="ask">
        <h2 id="askH">💬 Tetszik a videó?</h2>
        <p class="hint" id="askHint"></p>
        <div class="modbox" id="modBox"><div class="modin">
          <p class="hint" id="tcHint">Írd le, hogy mit változtatnál.</p>
          <button type="button" class="tc" id="bTc" hidden title="Az aktuális időpont beszúrása">⏱ Időkód beszúrása · <b id="tcNow">0:00</b></button>
          <textarea id="fb" placeholder=""></textarea>
        </div></div>
        <div class="cfm" id="cfm" hidden><p class="cfm-t" id="cfmT"></p><p class="cfm-s" id="cfmS"></p><div class="cfm-b"><button type="button" class="ok" id="cfmYes">✓ Igen, jóváhagyom</button><button type="button" class="cfm-no" id="cfmNo"></button></div></div>
        <div class="okmsg" id="okMsg" hidden><label for="okNote">Szeretnél üzenni valamit? <span>(nem kötelező)</span></label><textarea id="okNote" rows="3" maxlength="1500"></textarea></div>
        <div class="row"><button type="button" class="ok" id="bOk">✓ Jóváhagyom</button><button type="button" class="mod" id="bSend">↩ Módosítást kérek</button><button type="button" class="modx" id="bModX" hidden>Mégse</button></div>

      </div>
      <div id="doneOk" hidden><p class="done">Köszönjük! A videót jóváhagytad.</p>
        <div class="note" id="noteBox" hidden><label for="note">Szeretnél üzenni valamit?</label><textarea id="note" rows="3" maxlength="1500"></textarea><p class="err" id="err3" hidden></p><button type="button" class="nsend" id="bNote">Üzenet küldése</button></div>
        <p class="nok" id="noteOk" hidden>✓ Az üzenetedet elküldtük.</p></div>
      <p class="done m" id="doneMod" hidden>Köszönjük! Megkaptuk a módosítási kérésedet, hamarosan jelentkezünk.</p>
      <p class="err" id="err2" hidden></p>
    <div id="dlWrap" class="dlwrap" hidden><a id="dl" class="dl-big" href="#" rel="noopener">⬇ Videó letöltése</a></div>
    </aside>
  </section>
  <p class="err" id="err" hidden></p>
</main>

<script src="jovahagyas.js"></script>
