<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<title>Videó jóváhagyása – Lumos Motion</title>
<style>
@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02AF}
:root{--ink:#101923;--mut:#56656f;--line:#dde4eb;--bg:#f0f4f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;padding:28px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(16,25,35,.08);width:min(1180px,100%);margin:0 auto;padding:24px 26px 26px}
.head{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.logo{height:52px;width:auto;flex:none;display:block}
.ttl{min-width:0;flex:1}
h1{font-size:20px;margin:0 0 2px;line-height:1.25}
.sub{color:var(--mut);margin:0;font-size:14px}
.sub a{color:var(--mut)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.player{position:relative;aspect-ratio:16/9;background:#0e1620;border-radius:14px;overflow:hidden}
.player.vert{aspect-ratio:var(--ar,9/16);max-height:76vh;margin:0 auto}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0e1620}
.noembed{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:#cfd8df;text-align:center;padding:20px;height:100%;position:absolute;inset:0}
.noembed a,.watch{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#101923;text-decoration:none;font-weight:700;padding:10px 16px;border-radius:12px}
.spin{width:22px;height:22px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.side{border:1px solid var(--line);border-radius:14px;padding:16px;background:#fbfcfd}
#ask{display:flex;flex-direction:column;gap:10px}
.side h2{font-size:15px;margin:0}
.hint{font-size:12.5px;color:var(--mut);margin:0;line-height:1.45}
textarea{width:100%;min-height:170px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;background:#fff}
textarea:focus{outline:2px solid #ffb547;outline-offset:1px;border-color:transparent}
.tc{align-self:flex-start;font:inherit;font-size:13px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer;color:var(--ink)}
.tc:hover{border-color:#b9c5cf}.tc b{font-variant-numeric:tabular-nums}
.row{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.row button{width:100%;white-space:nowrap}
button{font:inherit;font-weight:700;border-radius:12px;padding:12px 16px;cursor:pointer;border:1px solid transparent}
button:disabled{opacity:.6;cursor:default}
.ok{background:linear-gradient(90deg,#ffde59,#ff914d);color:#101923}
.mod{background:#fff;color:#b3261e;border-color:#e3b4b0}
.done{padding:14px;border-radius:12px;background:#eaf7ef;color:#1e7a46;font-weight:600;margin:0}
.done.m{background:#fff4f2;color:#b3261e}
.err{color:#b3261e;font-weight:600;margin:0}
.body.vside{grid-template-columns:minmax(0,1fr) 380px}
@media(max-width:860px){.head{flex-direction:column;align-items:flex-start;gap:12px}h1{font-size:18px}.body,.body.vside{grid-template-columns:1fr}.player.vert{max-height:70vh}body{padding:12px 10px}.card{padding:16px 14px}}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="head"><img class="logo" src="logo-jovahagyas.png" width="1241" height="373" alt="Lumos Motion Jóváhagyás">
    <div class="ttl" id="ttl" hidden><h1 id="video"></h1><p class="sub"><span id="project"></span><span id="newTab" hidden> · <a id="watch2" href="#" target="_blank" rel="noopener">↗ Megnyitás új lapon</a></span></p></div></div>
  <p id="load">Betöltés…</p>
  <section id="main" class="body" hidden>
    <div><div class="player" id="player"></div></div>
    <aside class="side">
      <div id="ask">
        <h2>💬 Észrevételek</h2>
        <p class="hint" id="tcHint">Ha módosítást szeretnél, írd le ide – mindegyiket új sorba, időkóddal (pl. 0:12 – a felirat legyen nagyobb).</p>
        <button type="button" class="tc" id="bTc" hidden title="Az aktuális időpont beszúrása (Enter)">⏱ Időkód beszúrása · <b id="tcNow">0:00</b></button>
        <textarea id="fb" placeholder="Írd ide az észrevételeidet…"></textarea>
        <div class="row"><button type="button" class="ok" id="bOk">✓ Jóváhagyom</button><button type="button" class="mod" id="bSend">↩ Módosítást kérek</button></div>
      </div>
      <p class="done" id="doneOk" hidden>Köszönjük! A videót jóváhagytad.</p>
      <p class="done m" id="doneMod" hidden>Köszönjük! Megkaptuk a módosítási kérésedet, hamarosan jelentkezünk.</p>
      <p class="err" id="err2" hidden></p>
    </aside>
  </section>
  <p class="err" id="err" hidden></p>
</main>
<script src="config.js"></script>
<script src="jovahagyas.js"></script>
</body>
</html>
