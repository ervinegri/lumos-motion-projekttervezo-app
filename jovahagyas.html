<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Videó jóváhagyása – Lumos Motion</title>
<style>
@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-wght-normal.woff2) format('woff2-variations')}
@font-face{font-family:Montserrat;font-style:normal;font-display:swap;font-weight:100 900;src:url(fonts/montserrat-latin-ext-wght-normal.woff2) format('woff2-variations');unicode-range:U+0100-02AF}
:root{--ink:#101923;--line:#dde4eb;--bg:#f0f4f7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 50px rgba(16,25,35,.08);width:min(560px,100%);padding:28px}
.logo{font:900 20px/.9 Arial,Helvetica,sans-serif;letter-spacing:-1px;margin-bottom:22px}
.logo span{display:inline-block;background:#000;color:#fff;padding:2px 6px;margin-top:3px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:#56656f;margin:0 0 20px}
.watch{display:inline-flex;align-items:center;gap:8px;background:#101923;color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:12px;margin-bottom:22px}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;cursor:pointer;border:1px solid transparent}
.ok{background:linear-gradient(90deg,#ffde59,#ff914d);color:#101923}
.mod{background:#fff;color:#b3261e;border-color:#e3b4b0}
textarea{width:100%;min-height:120px;font:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.done{padding:16px;border-radius:12px;background:#eaf7ef;color:#1e7a46;font-weight:600}
.done.m{background:#fff4f2;color:#b3261e}
.err{color:#b3261e;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo">LUMOS MOTION<br><span>VIDEÓ JÓVÁHAGYÁS</span></div>
  <p id="load">Betöltés…</p>
  <section id="main" hidden>
    <h1 id="video"></h1>
    <p class="sub" id="project"></p>
    <a class="watch" id="watch" href="#" target="_blank" rel="noopener">▶ Videó megnézése</a>
    <div id="ask">
      <div class="row"><button type="button" class="ok" id="bOk">✓ Jóváhagyom</button><button type="button" class="mod" id="bMod">Módosítást kérek</button></div>
      <div id="modBox" hidden><textarea id="fb" placeholder="Írd le, mit módosítsunk – akár időkóddal (pl. 0:12 – a felirat legyen nagyobb)."></textarea><button type="button" class="mod" id="bSend">Módosítási kérés elküldése</button></div>
    </div>
    <p class="done" id="doneOk" hidden>Köszönjük! A videót jóváhagytad.</p>
    <p class="done m" id="doneMod" hidden>Köszönjük! Megkaptuk a módosítási kérésedet, hamarosan jelentkezünk.</p>
  </section>
  <p class="err" id="err" hidden></p>
</main>
<script src="config.js"></script>
<script src="jovahagyas.js"></script>
</body>
</html>
